<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #ddd;
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .suggestion-poster {
            width: 50px;
            height: 75px;
            object-fit: cover;
            border-radius: 5px;
            flex-shrink: 0;
        }

        .suggestion-content {
            flex: 1;
        }

        .suggestion-item:hover {
            background: #f8f8f8;
        }

        .suggestion-title {
            font-weight: 600;
            color: #333;
        }

        .suggestion-meta {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 15px;
            color: #666;
        }

        .selected-movies {
            margin-bottom: 30px;
        }

        .selected-movies h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .movie-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .movie-chip {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        .movie-chip-poster {
            width: 30px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
        }

        .movie-chip-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .remove-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .remove-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        .get-recommendations {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            margin: 0 auto;
        }

        .get-recommendations:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .get-recommendations:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recommendations {
            margin-top: 40px;
        }

        .recommendations h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #f8f8f8;
            border-radius: 15px;
            padding: 0;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeIn 0.5s ease;
        }

        .movie-poster {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .movie-card-content {
            padding: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .movie-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .movie-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .movie-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .genre-tag {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        .match-score {
            background: #4caf50;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        /*
         * Sub-elements of the match-score block. These previously lived as inline style attributes
         * inside a template string; moving them here keeps presentation in the stylesheet and let the
         * card be built with safe DOM calls instead of interpolated HTML.
         */
        .match-multi {
            font-size: 0.85em;
            margin-top: 5px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 5px;
            display: inline-block;
        }

        .match-similar {
            font-size: 0.8em;
            margin-top: 5px;
            font-weight: normal;
        }

        .match-breakdown {
            font-size: 0.75em;
            margin-top: 5px;
            font-weight: normal;
        }

        .warning {
            text-align: center;
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }

        /* ===========================================================================================
           RESPONSIVE
           ===========================================================================================

           The page had no media queries at all and was desktop-only. The specific failure on a phone:
           `body` contributes 20px of horizontal padding and `.container` another 40px, so a 375px
           screen leaves 255px of content -- but `.movie-grid` demanded `minmax(280px, 1fr)`, making
           every card wider than the space available. That is what produced horizontal scrolling.

           Each breakpoint therefore reduces padding AND the grid minimum together; changing one
           without the other just moves the overflow.
           =========================================================================================== */

        /* Tablets and small laptops. */
        @media (max-width: 900px) {
            body { padding: 12px; }

            .container {
                padding: 24px;
                border-radius: 14px;
            }

            h1 { font-size: 2em; }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 16px;
            }
        }

        /* Phones. */
        @media (max-width: 560px) {
            body { padding: 8px; }

            .container {
                padding: 16px 14px;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 6px;
            }

            .subtitle {
                font-size: 0.9em;
                margin-bottom: 20px;
            }

            h2 { font-size: 1.15em; }

            /* Two columns rather than one: posters stay legible and far less scrolling is needed. */
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .movie-card h3 { font-size: 1em; }
            .movie-meta { font-size: 0.78em; }
            .match-score { font-size: 0.85em; }

            /* Chips wrap to full width so long titles are not truncated on a narrow screen. */
            .movie-chip {
                width: 100%;
                justify-content: space-between;
            }

            .suggestions { max-height: 55vh; }

            /* 16px prevents iOS Safari from zooming in when the field receives focus. */
            input[type="text"] { font-size: 16px; }

            .get-recommendations {
                width: 100%;
                font-size: 1em;
            }
        }

        /* Nothing should ever scroll the page sideways, whatever the content. */
        html, body { max-width: 100%; overflow-x: hidden; }
        .movie-card h3, .movie-chip span { overflow-wrap: anywhere; }

        /* ===========================================================================================
           ACCESSIBILITY
           =========================================================================================== */

        /* Keyboard-highlighted suggestion. Matches :hover so mouse and keyboard look identical. */
        .suggestion-item.active {
            background: #eef0fb;
            outline: 2px solid #667eea;
            outline-offset: -2px;
        }

        /* Every interactive element needs a visible focus ring; several had none. */
        button:focus-visible,
        input:focus-visible,
        .suggestion-item:focus-visible {
            outline: 3px solid #4c5fd7;
            outline-offset: 2px;
        }

        /* Announced to screen readers, invisible on screen. Not `display: none`, which would stop
           screen readers reading it at all. */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ===========================================================================================
           STATUS AND ERRORS
           =========================================================================================== */

        .status-banner {
            margin: 16px 0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-banner.error {
            background: #fdecea;
            color: #a4231a;
            border: 1px solid #f5c2be;
        }

        .status-banner.info {
            background: #eef2ff;
            color: #3730a3;
            border: 1px solid #c7d2fe;
        }

        .status-banner button {
            margin-left: auto;
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Respect users who have asked the OS to reduce motion. */
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2s; }
            * { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Movie Recommender</h1>
        <p class="subtitle">Select 3-10 movies you love and get personalized recommendations</p>

        <!--
            ARIA combobox pattern. The search box was previously a bare <input> with a <div> of
            results, which is invisible to a screen reader: nothing announced that suggestions had
            appeared, how many there were, or which one was highlighted.

            role="combobox" + aria-expanded + aria-controls + aria-activedescendant is the standard
            pairing. aria-activedescendant is the important one — it lets focus stay in the input
            (so typing keeps working) while still telling assistive tech which option is current.
        -->
        <div class="search-section">
            <label for="searchInput" class="sr-only">Search for movies to add to your list</label>
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for movies..."
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="suggestions"
                    aria-autocomplete="list"
                    aria-describedby="searchHelp"
                    autocomplete="off">
                <p id="searchHelp" class="sr-only">
                    Type at least two characters. Use the up and down arrow keys to review results,
                    Enter to add a movie, and Escape to dismiss the list.
                </p>
                <div class="suggestions" id="suggestions" role="listbox"
                     aria-label="Movie search results"></div>
            </div>
        </div>

        <!--
            Status messages. aria-live="polite" means a screen reader announces changes here without
            interrupting whatever it is currently reading. Previously failures only reached
            console.error, so a blind user got no feedback at all — and neither did a sighted one.
        -->
        <div id="statusRegion" aria-live="polite" aria-atomic="true"></div>

        <div class="selected-movies">
            <h2>Your Selected Movies (<span id="count">0</span>/10)</h2>
            <div class="movie-chips" id="selectedMovies"></div>
            <p class="warning" id="warning"></p>
        </div>

        <button class="get-recommendations" id="getRecommendations" disabled>
            Get Recommendations
        </button>

        <div class="recommendations" id="recommendationsSection" style="display: none;">
            <h2>Recommended Movies For You</h2>
            <div class="movie-grid" id="movieGrid"></div>
        </div>
    </div>

    <script>
        /**
         * Movie Recommender — frontend.
         *
         * Flow: search TMDB -> select 3-10 movies -> fan out to TMDB similar/recommendations for each
         * pick -> score every candidate -> render the top 30 with a match breakdown.
         *
         * All TMDB access goes through our own /api proxy so the API key stays server-side.
         */

        /**
         * API base path.
         *
         * Always relative, and it works in all three environments for the same reason: the API is
         * always same-origin from the browser's point of view.
         *
         *   local dev  -> Express serves this page and the API together
         *   Render     -> same, in production
         *   Vercel     -> Vercel serves the page and *rewrites* /api/* through to Render (see
         *                 vercel.json), so the browser never sees a second domain
         *
         * That rewrite is why there is no host detection here and no CORS configuration to keep in
         * sync — including for preview deployments, whose domains change per branch.
         */
        const API_URL = '/api';

        /** Minimum picks required before recommendations can be requested. */
        const MIN_MOVIES = 3;
        /** Maximum picks allowed. */
        const MAX_MOVIES = 10;
        /** Debounce delay (ms) between keystrokes and firing a search. */
        const SEARCH_DEBOUNCE_MS = 500;

        /** @type {Array<object>} The user's selected movies, in pick order. */
        const selectedMovies = [];
        /** @type {Object<string, Array<object>>} Memoized search results, keyed by exact query. */
        const searchCache = {};
        /**
         * TMDB ids with an in-flight details request from selectMovie().
         *
         * Needed because selectMovie's duplicate and limit guards run *before* an await, so two fast
         * clicks on the same suggestion would both pass the checks and both push. See selectMovie().
         *
         * @type {Set<number>}
         */
        const pendingSelections = new Set();

        let searchTimeout;
        /**
         * Monotonic counter identifying the most recently *issued* search.
         *
         * The debounce alone does not prevent overlapping in-flight requests: typing "bat", pausing,
         * then typing "man" fires two searches, and if the older one resolves second it would render
         * results for "bat" while the input reads "batman". Each response compares its own token
         * against this value and discards itself if it is no longer the newest.
         */
        let latestSearchToken = 0;

        /** Index of the keyboard-highlighted suggestion; -1 when none is. */
        let activeSuggestion = -1;

        /** localStorage key for the user's picks. Versioned so a shape change can't break loading. */
        const STORAGE_KEY = 'movieRecommender.picks.v1';

        const searchInput = document.getElementById('searchInput');
        const suggestionsDiv = document.getElementById('suggestions');
        const selectedMoviesDiv = document.getElementById('selectedMovies');
        const countSpan = document.getElementById('count');
        const warningP = document.getElementById('warning');
        const getRecommendationsBtn = document.getElementById('getRecommendations');
        const statusRegion = document.getElementById('statusRegion');

        /**
         * Shows a status message, replacing any previous one.
         *
         * Failures previously only reached `console.error`, so nothing appeared on screen and nothing
         * was announced to a screen reader — the app just looked like it had done nothing. The
         * container is `aria-live="polite"`, so writing here announces the message without cutting off
         * whatever is currently being read.
         *
         * @param {string} message - Text to show. Set via textContent, never parsed as markup.
         * @param {object} [options]
         * @param {'info'|'error'} [options.type]
         * @param {boolean} [options.spinner] - Show a progress indicator.
         * @param {() => void} [options.onRetry] - Adds a Retry button wired to this callback.
         */
        function showStatus(message, { type = 'info', spinner = false, onRetry } = {}) {
            statusRegion.replaceChildren();

            const banner = document.createElement('div');
            banner.className = `status-banner ${type}`;

            if (spinner) {
                const dot = document.createElement('span');
                dot.className = 'spinner';
                // Decorative: the adjacent text already conveys the state.
                dot.setAttribute('aria-hidden', 'true');
                banner.appendChild(dot);
            }

            const text = document.createElement('span');
            text.textContent = message;
            banner.appendChild(text);

            if (onRetry) {
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.textContent = 'Retry';
                retry.addEventListener('click', onRetry);
                banner.appendChild(retry);
            }

            statusRegion.appendChild(banner);
        }

        /** Removes any status message. */
        function clearStatus() {
            statusRegion.replaceChildren();
        }

        /**
         * Opens or closes the suggestions list, keeping ARIA state in sync.
         *
         * Screen readers rely on `aria-expanded` to announce that results appeared. Toggling display
         * without it leaves them silent.
         *
         * @param {boolean} open
         */
        function setSuggestionsOpen(open) {
            suggestionsDiv.style.display = open ? 'block' : 'none';
            searchInput.setAttribute('aria-expanded', String(open));
            if (!open) {
                activeSuggestion = -1;
                searchInput.removeAttribute('aria-activedescendant');
            }
        }

        /**
         * Moves the keyboard highlight through the suggestions.
         *
         * Focus deliberately stays in the input so typing keeps working; `aria-activedescendant`
         * is what tells assistive technology which option is current. That is the whole point of the
         * combobox pattern — moving real focus into the list would break typing.
         *
         * @param {number} delta - +1 for down, -1 for up.
         */
        function moveActiveSuggestion(delta) {
            const items = [...suggestionsDiv.querySelectorAll('.suggestion-item')];
            if (items.length === 0) return;

            // Wraps at both ends, which is what the ARIA authoring practices describe.
            activeSuggestion = (activeSuggestion + delta + items.length) % items.length;

            items.forEach((item, i) => {
                const isActive = i === activeSuggestion;
                item.classList.toggle('active', isActive);
                item.setAttribute('aria-selected', String(isActive));
                if (isActive) {
                    searchInput.setAttribute('aria-activedescendant', item.id);
                    item.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(searchTimeout);
            activeSuggestion = -1;

            if (query.length < 2) {
                setSuggestionsOpen(false);
                return;
            }

            searchTimeout = setTimeout(() => searchMovies(query), SEARCH_DEBOUNCE_MS);
        });

        /**
         * Keyboard control for the suggestions list.
         *
         * The dropdown was previously mouse-only: a keyboard user could type a query and then had no
         * way to select a result.
         */
        searchInput.addEventListener('keydown', (e) => {
            const isOpen = suggestionsDiv.style.display === 'block';

            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                if (!isOpen) return;
                // Stop the caret jumping to the start or end of the input.
                e.preventDefault();
                moveActiveSuggestion(e.key === 'ArrowDown' ? 1 : -1);
                return;
            }

            if (e.key === 'Enter') {
                if (!isOpen || activeSuggestion < 0) return;
                e.preventDefault();
                suggestionsDiv.querySelectorAll('.suggestion-item')[activeSuggestion]?.click();
                return;
            }

            if (e.key === 'Escape') {
                if (!isOpen) return;
                e.preventDefault();
                setSuggestionsOpen(false);
            }
        });

        /**
         * Fetches JSON from our API, turning a non-2xx response into a thrown Error.
         *
         * The server now propagates real status codes: 400 for a malformed request, 404 for an
         * unknown movie, 503 when it has no TMDB key. Previously every failure arrived as HTTP 200
         * with a `{ success: false }` body, so `response.json()` succeeded and the caller silently
         * treated a broken call as an empty result. Checking `ok` is what makes those statuses useful.
         *
         * @param {string} url - Absolute or relative URL to request.
         * @returns {Promise<object>} Parsed JSON body.
         * @throws {Error} If the response status is not 2xx.
         */
        async function fetchJson(url) {
            const response = await fetch(url);

            if (!response.ok) {
                // The server sends `{ error: "..." }`; fall back to the status if the body is not JSON.
                let message = `Request failed (${response.status})`;
                try {
                    const body = await response.json();
                    if (body && typeof body.error === 'string') message = body.error;
                } catch {
                    // Non-JSON error body — keep the status-based message.
                }
                const error = new Error(message);
                error.status = response.status;
                throw error;
            }

            return response.json();
        }

        /**
         * Replaces the suggestions dropdown with a single plain-text status line.
         *
         * Uses textContent rather than innerHTML so that any message derived from an error or API
         * payload cannot inject markup.
         *
         * @param {string} message - Text to display.
         */
        function showSuggestionStatus(message) {
            suggestionsDiv.replaceChildren();
            const div = document.createElement('div');
            div.className = 'loading';
            div.textContent = message;
            suggestionsDiv.appendChild(div);
            setSuggestionsOpen(true);
        }

        /**
         * Searches TMDB and renders the results into the suggestions dropdown.
         *
         * Stale responses are discarded via `latestSearchToken`, so results always correspond to the
         * most recent query the user typed regardless of network ordering.
         *
         * @param {string} query - Search text (already trimmed, at least 2 characters).
         */
        async function searchMovies(query) {
            // Claim a token before doing anything async; any later call supersedes this one.
            const token = ++latestSearchToken;

            const cached = searchCache[query];
            if (cached) {
                displaySuggestions(cached);
                return;
            }

            showSuggestionStatus('Searching...');

            try {
                const data = await fetchJson(`${API_URL}/search?query=${encodeURIComponent(query)}`);

                // A newer search was issued while this one was in flight - drop this result.
                if (token !== latestSearchToken) return;

                if (data.results && data.results.length > 0) {
                    /*
                     * The require-atomic-updates warning on the next line is a false positive. The
                     * cache key is this call's own `query` and the value is its own response, so the
                     * write is idempotent: two concurrent searches for different queries touch
                     * different keys, and two for the same query write identical values. The real
                     * user-visible ordering hazard is handled by the `latestSearchToken` check above,
                     * which decides what actually gets rendered.
                     */
                    // eslint-disable-next-line require-atomic-updates
                    searchCache[query] = data.results;
                    displaySuggestions(data.results);
                } else {
                    showSuggestionStatus('No movies found');
                }
            } catch (error) {
                if (token !== latestSearchToken) return;
                // The server's message is specific and user-safe (e.g. "Query too long"), so prefer
                // it over a generic string.
                showSuggestionStatus(error.message || 'Error: could not reach the server');
                console.error('Search failed:', error);
            }
        }

        /**
         * Placeholder poster shown when TMDB has no artwork for a title.
         *
         * @param {number} width - Placeholder width in px.
         * @param {number} height - Placeholder height in px.
         * @param {string} label - Text drawn in the centre.
         * @returns {string} An inline SVG data URI.
         */
        function placeholderPoster(width, height, label) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
                `<rect width="${width}" height="${height}" fill="#ddd"/>` +
                `<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" ` +
                `fill="#999" font-size="${Math.round(height / 20)}">${label}</text></svg>`;
            return `data:image/svg+xml,${encodeURIComponent(svg)}`;
        }

        /**
         * Builds a poster <img> element.
         *
         * @param {string|null} posterPath - TMDB poster_path, or null/undefined if absent.
         * @param {string} size - TMDB image size segment, e.g. 'w92' or 'w500'.
         * @param {string} title - Movie title, used as alt text.
         * @param {string} className - CSS class for the element.
         * @param {number} w - Placeholder width.
         * @param {number} h - Placeholder height.
         * @returns {HTMLImageElement}
         */
        function buildPoster(posterPath, size, title, className, w, h) {
            const img = document.createElement('img');
            img.src = posterPath
                ? `https://image.tmdb.org/t/p/${size}${posterPath}`
                : placeholderPoster(w, h, 'No Image');
            // Assigning via the property (not an HTML attribute string) means a title containing
            // quotes or angle brackets cannot break out of the markup.
            img.alt = title || 'Movie poster';
            img.className = className;
            img.loading = 'lazy';
            return img;
        }

        /**
         * Renders search results into the suggestions dropdown.
         *
         * Elements are constructed with createElement/textContent rather than innerHTML. TMDB data is
         * third-party and community-edited, so titles and overviews are never interpolated into markup.
         *
         * @param {Array<object>} movies - TMDB search results.
         */
        function displaySuggestions(movies) {
            suggestionsDiv.replaceChildren();

            movies.slice(0, 10).forEach((movie, index) => {
                const year = movie.release_date ? movie.release_date.substring(0, 4) : 'N/A';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

                const item = document.createElement('div');
                item.className = 'suggestion-item';
                // aria-activedescendant references an element by id, so each option needs one.
                item.id = `suggestion-${index}`;
                item.setAttribute('role', 'option');
                item.setAttribute('aria-selected', 'false');

                const content = document.createElement('div');
                content.className = 'suggestion-content';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'suggestion-title';
                titleDiv.textContent = `${movie.title} (${year})`;

                const metaDiv = document.createElement('div');
                metaDiv.className = 'suggestion-meta';
                metaDiv.textContent = `Rating: ${rating}/10`;

                content.append(titleDiv, metaDiv);
                item.append(
                    buildPoster(movie.poster_path, 'w92', movie.title, 'suggestion-poster', 50, 75),
                    content
                );
                item.addEventListener('click', () => selectMovie(movie));
                suggestionsDiv.appendChild(item);
            });

            activeSuggestion = -1;
            setSuggestionsOpen(true);
        }

        /**
         * Adds a movie to the selection, fetching its full details (genres, director, cast) first.
         *
         * The duplicate and limit checks below run before an `await`, so without a guard two rapid
         * clicks on the same suggestion would both pass validation and both push, producing a
         * duplicate chip and allowing the MAX_MOVIES cap to be exceeded. `pendingSelections` closes
         * that window by claiming the id synchronously.
         *
         * @param {object} movie - A TMDB search result; only `id` and `title` are required here.
         */
        async function selectMovie(movie) {
            if (selectedMovies.length + pendingSelections.size >= MAX_MOVIES) {
                warningP.textContent = `Maximum ${MAX_MOVIES} movies allowed`;
                return;
            }

            if (selectedMovies.some(m => m.id === movie.id) || pendingSelections.has(movie.id)) {
                warningP.textContent = 'Movie already selected';
                return;
            }

            pendingSelections.add(movie.id);

            try {
                const fullMovie = await fetchJson(`${API_URL}/movie/${movie.id}`);

                selectedMovies.push({
                    id: fullMovie.id,
                    title: fullMovie.title,
                    year: fullMovie.release_date ? fullMovie.release_date.substring(0, 4) : 'N/A',
                    poster: fullMovie.poster_path,
                    rating: fullMovie.vote_average,
                    genres: fullMovie.genres || [],
                    director: fullMovie.credits?.crew?.find(c => c.job === 'Director')?.name || 'N/A',
                    // NOTE: only the top 3 actors are kept, but candidates are compared against their
                    // top 10, so actor overlap almost never fires. This asymmetry is deliberate for
                    // now and is addressed when the scoring model is rebuilt.
                    actors: fullMovie.credits?.cast?.slice(0, 3).map(a => a.name) || []
                });

                updateSelectedMovies();
                searchInput.value = '';
                setSuggestionsOpen(false);
                warningP.textContent = '';
            } catch (error) {
                console.error('Error fetching movie details:', error);
                showStatus(`Could not load "${movie.title}". ${error.message}`, {
                    type: 'error',
                    onRetry: () => { clearStatus(); selectMovie(movie); }
                });
            } finally {
                // Always release the claim, or a failed fetch would permanently block re-selection.
                pendingSelections.delete(movie.id);
            }
        }

        /**
         * Re-renders the selected-movie chips and syncs the counter, button state, and warning text.
         *
         * Remove buttons carry the movie's TMDB id in a data attribute and are wired through a single
         * delegated listener (see below) rather than an inline `onclick="removeMovie(i)"`. Keying on
         * id instead of array index removes the coupling between rendered markup and array position,
         * and avoids needing a global function reachable from an HTML attribute.
         */
        /**
         * Saves the current picks so a refresh does not wipe them.
         *
         * Only the trimmed fields the UI needs are stored — not the full TMDB payload, which is
         * ~34 KB per film and would blow past localStorage's ~5 MB budget with a handful of picks.
         *
         * Storage can throw (private browsing, quota exceeded, disabled entirely). Losing persistence
         * must never break the app, so failures are swallowed deliberately.
         */
        function savePicks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedMovies));
            } catch {
                // Non-fatal: the session still works, it just will not survive a refresh.
            }
        }

        /**
         * Restores picks saved by a previous session.
         *
         * Everything is validated rather than trusted: localStorage is user-writable and may hold
         * data from an older version of this code. Anything malformed is discarded rather than
         * allowed to render.
         *
         * @returns {number} How many picks were restored.
         */
        function loadPicks() {
            let stored;
            try {
                stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch {
                return 0;
            }

            if (!Array.isArray(stored)) return 0;

            const valid = stored.filter(m =>
                m && typeof m.id === 'number' && typeof m.title === 'string');

            selectedMovies.push(...valid.slice(0, MAX_MOVIES));
            return selectedMovies.length;
        }

        function updateSelectedMovies() {
            selectedMoviesDiv.replaceChildren();

            selectedMovies.forEach(movie => {
                const chip = document.createElement('div');
                chip.className = 'movie-chip';

                const content = document.createElement('div');
                content.className = 'movie-chip-content';

                if (movie.poster) {
                    content.appendChild(
                        buildPoster(movie.poster, 'w92', movie.title, 'movie-chip-poster', 50, 75)
                    );
                }

                const label = document.createElement('span');
                label.textContent = `${movie.title} (${movie.year})`;
                content.appendChild(label);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.type = 'button';
                removeBtn.textContent = '×';
                removeBtn.dataset.movieId = String(movie.id);
                removeBtn.setAttribute('aria-label', `Remove ${movie.title}`);

                chip.append(content, removeBtn);
                selectedMoviesDiv.appendChild(chip);
            });

            countSpan.textContent = selectedMovies.length;
            getRecommendationsBtn.disabled = selectedMovies.length < MIN_MOVIES;

            // Persist here rather than at each call site, so add, remove, and restore are all covered
            // by one place that cannot be forgotten.
            savePicks();

            if (selectedMovies.length < MIN_MOVIES) {
                const remaining = MIN_MOVIES - selectedMovies.length;
                warningP.textContent = `Please select at least ${remaining} more movie(s)`;
            } else {
                warningP.textContent = '';
            }
        }

        // Delegated handler for every chip's remove button, present and future.
        selectedMoviesDiv.addEventListener('click', (e) => {
            const btn = e.target.closest('.remove-btn');
            if (!btn) return;
            removeMovie(Number(btn.dataset.movieId));
        });

        /**
         * Removes a movie from the selection by TMDB id.
         *
         * @param {number} movieId - TMDB id of the movie to drop.
         */
        function removeMovie(movieId) {
            const index = selectedMovies.findIndex(m => m.id === movieId);
            if (index === -1) return;
            selectedMovies.splice(index, 1);
            updateSelectedMovies();
        }

        getRecommendationsBtn.addEventListener('click', getRecommendations);

        /**
         * Builds the recommendation list from the user's selections and renders it.
         *
         * For each selected movie this asks TMDB for both `similar` and `recommendations`, fetches
         * full details for every candidate, and scores it against that selection. Candidates surfaced
         * by more than one pick accumulate a match count.
         *
         * PERFORMANCE: candidate details are fetched serially inside a nested loop, so a 10-movie
         * selection issues up to ~200 sequential round-trips and can take 30-60 seconds. This is a
         * known architectural limitation, not an oversight - it is resolved by moving the pipeline
         * server-side behind a cache.
         *
         * KNOWN ISSUES (deliberately left for the scoring rebuild, so the same code is not fixed
         * twice): the `combined.slice(0, 20)` below discards the `recommendations` results because
         * `similar` already fills 20 slots; the score-max branch for multi-match candidates is
         * unreachable; equal scores tie-break by insertion order, favouring the first-picked movie;
         * and the catch below wraps the whole candidate loop, so a single failed request (a TMDB 429
         * is likely at this request volume) silently drops the rest of that movie's candidates.
         */
        async function getRecommendations() {
            if (selectedMovies.length < MIN_MOVIES) return;

            getRecommendationsBtn.disabled = true;
            getRecommendationsBtn.textContent = 'Finding similar movies...';

            // A cold request takes several seconds while the server fetches candidates from TMDB.
            // Without a visible indicator the page looks frozen, and a screen reader user gets no
            // signal at all that anything is happening.
            showStatus('Finding movies you might like...', { spinner: true });

            // try/finally guarantees the button is restored. Without it, anything thrown outside the
            // inner per-movie catch - a render error, a sort failure - would leave the button
            // permanently disabled reading "Finding similar movies...", recoverable only by reload.
            try {
                await buildAndRenderRecommendations();
                clearStatus();
            } catch (error) {
                console.error('Recommendation run failed:', error);
                showStatus(
                    error.message || 'Something went wrong building recommendations.',
                    { type: 'error', onRetry: () => getRecommendations() }
                );
            } finally {
                getRecommendationsBtn.disabled = false;
                getRecommendationsBtn.textContent = 'Get Recommendations';
            }
        }

        /**
         * Requests recommendations from the server and renders them.
         *
         * The entire pipeline -- candidate generation, detail fetching, scoring, and ranking -- now
         * runs server-side behind a cache. This previously looped in the browser, issuing up to ~200
         * sequential round-trips and taking 30-60 seconds; it is now one request.
         *
         * Moving it also fixed four bugs that lived in the removed code: candidates were only ever
         * scored against the first pick that surfaced them, TMDB's recommendations list was discarded
         * entirely, ties broke by pick order, and one failed request silently dropped ~20 candidates.
         */
        async function buildAndRenderRecommendations() {
            const response = await fetch(`${API_URL}/recommend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ movieIds: selectedMovies.map(m => m.id) })
            });

            if (!response.ok) {
                let message = `Request failed (${response.status})`;
                try {
                    const body = await response.json();
                    if (body && typeof body.error === 'string') message = body.error;
                } catch {
                    // Non-JSON error body - keep the status-based message.
                }
                throw new Error(message);
            }

            const { results, meta } = await response.json();
            console.log(`Recommendations: ${meta.returned} of ${meta.candidatePoolSize} candidates ` +
                `in ${meta.durationMs}ms`);

            // Partial results are reported rather than silently presented as complete.
            if (meta.failedCandidates > 0) {
                console.warn(`${meta.failedCandidates} candidate lookups failed; results may be incomplete.`);
            }

            displayRecommendations(results);
        }

        /**
         * Icons for the feature types the server reports in `contributions`.
         *
         * The server used to send fixed category totals ("Genres +10"); it now names the specific
         * features behind a match ("director: Christopher Nolan"), because cosine similarity
         * decomposes exactly into per-feature contributions. Naming *which* director or keyword drove
         * the match is strictly more useful than a category score.
         */
        const FEATURE_ICONS = {
            g: '🎭',      // genre
            k: '🔑',      // keyword
            c: '👥',      // cast
            d: '🎬',      // director
            w: '✍️',      // writer
            dec: '📅',    // decade
            lang: '🌐'    // original language
        };

        /**
         * Creates a <div> with a class and plain text content.
         *
         * @param {string} className - CSS class to apply.
         * @param {string} text - Text content, assigned via textContent (never parsed as markup).
         * @returns {HTMLDivElement}
         */
        function textDiv(className, text) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            return div;
        }

        /**
         * Renders the recommendation grid.
         *
         * Every string that originates from TMDB - title, overview, the names in "Similar to" - is
         * assigned through textContent or a DOM property, never interpolated into an HTML string.
         *
         * @param {Array<object>} recs - Scored recommendations, already sorted and truncated.
         */
        function displayRecommendations(recs) {
            const movieGrid = document.getElementById('movieGrid');
            const recommendationsSection = document.getElementById('recommendationsSection');

            movieGrid.replaceChildren();

            if (recs.length === 0) {
                movieGrid.appendChild(textDiv('empty-state', 'No recommendations found'));
            } else {
                recs.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';

                    const content = document.createElement('div');
                    content.className = 'movie-card-content';

                    const heading = document.createElement('h3');
                    heading.textContent = movie.title;

                    const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
                    const overview = movie.overview
                        ? `${movie.overview.substring(0, 100)}...`
                        : '';

                    content.append(
                        heading,
                        textDiv('movie-meta', `Year: ${movie.year}`),
                        textDiv('movie-meta', `Rating: ⭐ ${rating}/10`),
                        textDiv('movie-meta', overview)
                    );

                    // --- Match score block ---------------------------------------------------------
                    const scoreBox = document.createElement('div');
                    scoreBox.className = 'match-score';
                    scoreBox.append(document.createTextNode(`Match: ${movie.matchScore}%`));

                    // The old "🔥 Matches N of your movies!" badge is deliberately gone. Under the
                    // current model that count saturated at the number of picks -- nearly every film
                    // shares *something* with every pick (a language, a genre) -- so it rendered
                    // identically on all 30 cards and said nothing. The named contributions below
                    // carry the explanation instead.

                    const similarTo = movie.similarTo && movie.similarTo.length > 0
                        ? movie.similarTo.join(', ')
                        : 'N/A';
                    scoreBox.appendChild(textDiv('match-similar', `Because you liked: ${similarTo}`));

                    // Named features behind the match, strongest first.
                    if (movie.contributions && movie.contributions.length > 0) {
                        const parts = movie.contributions.map(c =>
                            `${FEATURE_ICONS[c.type] || '•'} ${c.label}`);
                        scoreBox.appendChild(textDiv('match-breakdown', parts.join('   ')));
                    } else if (movie.breakdown) {
                        // Legacy shape, still emitted if the TF-IDF artifacts failed to load and the
                        // server fell back to the old scorer.
                        const legacyLabels = [
                            ['genre', '🎭 Genres'], ['director', '🎬 Director'],
                            ['actors', '👥 Actors'], ['year', '📅 Era'], ['rating', '⭐ Quality']
                        ];
                        const parts = legacyLabels
                            .filter(([key]) => movie.breakdown[key] > 0)
                            .map(([key, label]) => `${label} (+${movie.breakdown[key]})`);
                        if (parts.length > 0) {
                            scoreBox.appendChild(textDiv('match-breakdown', parts.join('  ')));
                        }
                    }

                    content.appendChild(scoreBox);
                    card.append(
                        buildPoster(movie.poster_path, 'w500', movie.title, 'movie-poster', 280, 400),
                        content
                    );
                    movieGrid.appendChild(card);
                });
            }

            recommendationsSection.style.display = 'block';
            recommendationsSection.scrollIntoView({ behavior: 'smooth' });
        }

        /**
         * Restores any saved picks and renders the initial state.
         *
         * Runs last so every function it depends on is defined. `updateSelectedMovies()` is called
         * unconditionally because it also sets the counter and the button's disabled state — skipping
         * it when nothing was restored would leave the UI showing stale defaults.
         */
        (function init() {
            const restored = loadPicks();
            updateSelectedMovies();

            if (restored > 0) {
                showStatus(
                    `Restored ${restored} movie${restored === 1 ? '' : 's'} from your last visit.`,
                    { type: 'info' }
                );
            }
        })();

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                setSuggestionsOpen(false);
            }
        });
    </script>
</body>
</html>
