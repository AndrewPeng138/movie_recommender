<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>
    <style>
        /* ===========================================================================================
           DESIGN TOKENS

           Direction: a darkened screening room. The previous design put poster artwork inside a white
           card on a purple gradient, which fought the very thing the page exists to show. Inverting it
           — dark blue-biased ground, one warm projection-amber accent — leaves the posters as the only
           saturated colour on screen.

           Everything is expressed as custom properties so the light-mode override below only has to
           restate the palette, not re-style any component.
           =========================================================================================== */

        :root {
            --ground:      #0B0F14;   /* auditorium dark; blue-biased, not neutral grey */
            --surface:     #141A22;   /* cards, dropdown */
            --surface-2:   #1B242F;   /* raised elements, chips */
            --line:        #232D3A;
            --line-soft:   #1A2029;

            --ink:         #E8EDF2;
            --ink-2:       #B4C2CF;
            --muted:       #8494A4;

            --accent:      #EFA845;   /* projection amber — the lamp */
            --accent-soft: #3A2B14;
            --accent-ink:  #1A1206;

            --danger:      #FF8A80;
            --danger-soft: #3A1714;

            --radius:      10px;
            --radius-sm:   6px;

            --shadow:      0 1px 2px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.7);
            --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 24px 48px -16px rgba(0,0,0,.85);

            /* No webfonts: there is no build step, and a CDN link would add a dependency and a
               silent-fallback risk. These are deliberately chosen system stacks.
               Display = condensed, which is film-poster convention. Mono = every numeral, because
               this is fundamentally a scoring tool and digits are data. */
            --display: 'Bahnschrift SemiCondensed', 'Franklin Gothic Medium', 'Arial Narrow',
                       'Helvetica Neue Condensed', 'Roboto Condensed', sans-serif;
            --body:    'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system,
                       'Helvetica Neue', Arial, sans-serif;
            --mono:    ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace;

            color-scheme: dark;
        }

        /* Light mode: the same room with the lights up. Warm off-white rather than pure #FFF — a
           white panel behind poster artwork reads as a clinical form, which is exactly the look this
           redesign is replacing. The cream is slight on purpose; enough to take the glare off, not
           enough to look tinted. Ink stays near-black, so contrast is unaffected. */
        @media (prefers-color-scheme: light) {
            :root {
                --ground:      #E6E2DA;
                --surface:     #FBF8F3;
                --surface-2:   #F2EDE4;
                --line:        #D5CEC2;
                --line-soft:   #E5DFD4;

                --ink:         #14110D;
                --ink-2:       #3F3A33;
                --muted:       #6B645B;

                --accent:      #9A5A0C;   /* darkened so it passes contrast on a light ground */
                --accent-soft: #F6E7CE;
                --accent-ink:  #FFFFFF;

                --danger:      #A4231A;
                --danger-soft: #FDECEA;

                --shadow:      0 1px 2px rgba(12,18,24,.06), 0 8px 24px -10px rgba(12,18,24,.18);
                --shadow-lift: 0 2px 4px rgba(12,18,24,.08), 0 18px 40px -14px rgba(12,18,24,.28);

                color-scheme: light;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--body);
            background: var(--ground);
            color: var(--ink);
            min-height: 100vh;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 32px 28px 64px;
            background: none;      /* the white card is gone; the ground is the design */
            border-radius: 0;
            box-shadow: none;
        }

        /* ===========================================================================================
           HEADER
           =========================================================================================== */

        h1 {
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .06em;
            font-size: 2em;
            font-weight: 600;
            color: var(--ink);
            text-align: left;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--muted);
            text-align: left;
            font-size: .95em;
            margin-bottom: 28px;
        }

        h2 {
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 1.05em;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 14px;
        }

        /* ===========================================================================================
           SEARCH
           =========================================================================================== */

        .search-section { margin-bottom: 28px; }
        .search-box { position: relative; }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            font-family: var(--body);
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition: border-color .2s;
        }

        input[type="text"]::placeholder { color: var(--muted); }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            max-height: 420px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: var(--shadow);
        }

        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--line-soft);
            display: flex;
            gap: 12px;
            align-items: center;
            transition: background .15s;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: var(--surface-2); }

        .suggestion-poster {
            width: 58px;
            aspect-ratio: 2 / 3;
            height: auto;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
            background: var(--surface-2);
        }

        .suggestion-content { flex: 1; min-width: 0; }
        .suggestion-title { font-weight: 600; color: var(--ink); }

        .suggestion-meta {
            font-family: var(--mono);
            font-size: .78em;
            color: var(--muted);
            margin-top: 3px;
        }

        .loading {
            text-align: center;
            padding: 16px;
            color: var(--muted);
        }

        /* ===========================================================================================
           SELECTED PICKS — a filmstrip rather than form chips
           =========================================================================================== */

        .selected-movies { margin-bottom: 28px; }

        .movie-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .movie-chip {
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 8px 6px 6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .9em;
            animation: slideIn .25s ease;
        }

        .movie-chip-poster {
            width: 38px;
            aspect-ratio: 2 / 3;
            height: auto;
            object-fit: cover;
            border-radius: 3px;
        }

        .movie-chip-content { display: flex; align-items: center; gap: 9px; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: none; }
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--muted);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
        }

        .remove-btn:hover {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .warning {
            color: var(--muted);
            margin-top: 10px;
            font-size: .88em;
        }

        /* ===========================================================================================
           PRIMARY ACTION
           =========================================================================================== */

        .get-recommendations {
            background: var(--accent);
            color: var(--accent-ink);
            border: none;
            padding: 13px 32px;
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 600;
            font-size: 1em;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform .15s, filter .15s;
            display: block;
            margin: 0 auto;
        }

        .get-recommendations:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .get-recommendations:disabled { opacity: .35; cursor: not-allowed; }

        /* ===========================================================================================
           RESULTS
           =========================================================================================== */

        .recommendations { margin-top: 44px; }

        .recommendations h2 {
            text-align: left;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line-soft);
            margin-bottom: 20px;
            font-size: 1.3em;
            color: var(--ink);
        }

        /* 240px rather than the previous 280px: with posters no longer cropped they are ~30% taller,
           so narrower columns keep more results on screen at once. */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px 18px;
        }

        .movie-card {
            background: none;
            border-radius: var(--radius);
            padding: 0;
            overflow: visible;
            animation: fadeIn .4s ease;
        }

        .movie-poster {
            width: 100%;
            /* TMDB posters are 2:3, so matching that ratio means object-fit has nothing to crop at
               any column width. Replaced a fixed height that only matched at ~267px wide. */
            aspect-ratio: 2 / 3;
            height: auto;
            object-fit: cover;
            display: block;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            box-shadow: var(--shadow);
            transition: transform .2s, box-shadow .2s;
        }

        .movie-card:hover { transform: none; box-shadow: none; }

        .movie-card:hover .movie-poster {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lift);
        }

        .movie-card-content { padding: 12px 2px 0; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        .movie-card h3 {
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .015em;
            line-height: 1.15;
            color: var(--ink);
            margin-bottom: 6px;
            font-size: 1.1em;
            text-wrap: balance;
        }

        .movie-meta {
            font-family: var(--mono);
            color: var(--muted);
            font-size: .76em;
            margin-bottom: 5px;
        }

        /* The synopsis is supporting detail, not the point — the match explanation below is. */
        .movie-meta:nth-of-type(3) {
            font-family: var(--body);
            font-size: .82em;
            color: var(--ink-2);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 8px 0;
        }

        /* ===========================================================================================
           MATCH SCORE AND EXPLANATION

           The app's differentiator is saying WHY a film was recommended, so this is styled as
           readable evidence rather than a coloured badge.
           =========================================================================================== */

        .match-score {
            background: none;
            color: var(--accent);
            padding: 0;
            border-radius: 0;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 1em;
            display: block;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--line-soft);
        }

        .match-multi {
            font-size: .8em;
            margin-top: 5px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 2px 7px;
            border-radius: var(--radius-sm);
            display: inline-block;
        }

        .match-similar {
            font-family: var(--body);
            font-size: .78em;
            margin-top: 6px;
            font-weight: normal;
            color: var(--muted);
        }

        /* Grouped match explanation: one row per feature type, category named once on the left.
           Replaces a flat run of emoji-prefixed values, which repeated a glyph per item and never
           actually said what the category was. */
        .match-breakdown {
            font-family: var(--body);
            font-size: .78em;
            margin-top: 8px;
            font-weight: normal;
            color: var(--ink-2);
            display: grid;
            gap: 3px;
        }

        .match-row {
            display: grid;
            /* Fixed label column so the values line up down the card. */
            grid-template-columns: 62px 1fr;
            gap: 8px;
            align-items: baseline;
        }

        .match-label {
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .07em;
            font-size: .88em;
            color: var(--muted);
            font-weight: 600;
        }

        .match-values {
            color: var(--ink-2);
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .score-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-pct { flex-shrink: 0; }

        .score-meter {
            display: flex;
            gap: 2px;
            flex: 1;
            height: 10px;
            align-items: stretch;
            min-width: 0;
        }

        .score-meter i {
            flex: 1;
            background: var(--line);
            border-radius: 1px;
        }

        .score-meter i.on { background: var(--accent); }

        .match-dots { display: inline-flex; gap: 3px; margin-right: 4px; }

        .match-dots i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--line);
            display: block;
        }

        .match-dots i.on { background: var(--accent); }

        /* ===========================================================================================
           DETAIL DIALOG

           Weighted toward information, not artwork. Streaming services give ~85% of the panel to a
           large still and squeeze the actual details into a strip; here the backdrop is a 180px
           banner and everything below it is content — synopsis, why it matched, cast and crew.
           =========================================================================================== */

        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            backdrop-filter: blur(3px);
            z-index: 2000;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 28px 20px;
            overflow-y: auto;
        }

        .detail-overlay[hidden] { display: none; }

        .detail-dialog {
            position: relative;
            width: min(860px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lift);
            overflow: hidden;
            animation: dialogIn .18s ease;
        }

        @keyframes dialogIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }

        .detail-banner {
            /* Explicit width plus a fixed height, NOT `aspect-ratio` with a max-height: under that
               combination the browser derives the width from the clamped height, so the banner
               stopped short of the dialog edge and left a white gutter.

               400px against the 860px dialog is roughly 2.1:1 — cropped from the 16:9 source, but
               wide-format rather than the letterbox strip a shorter banner produced, and still
               under a third of a typical panel so the details stay the bulk of it. */
            width: 100%;
            height: 400px;
            max-height: 42vh;
            background-size: cover;
            background-position: center 30%;
            background-color: var(--surface-2);
            display: flex;
            align-items: flex-end;
            padding: 22px 26px;
            position: relative;
        }

        /* Scrim so the title stays readable over any artwork, however bright. */
        .detail-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.15) 100%);
        }

        .detail-banner-text { position: relative; z-index: 1; }

        .detail-title {
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .03em;
            font-size: 1.7em;
            font-weight: 600;
            color: #fff;
            margin: 0 0 4px;
            text-align: left;
            text-wrap: balance;
        }

        .detail-meta {
            font-family: var(--mono);
            font-size: .78em;
            color: rgba(255,255,255,.86);
            margin: 0;
        }

        .detail-close {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 3;
            background: rgba(0,0,0,.55);
            border: 1px solid rgba(255,255,255,.25);
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-close:hover { background: rgba(0,0,0,.8); }

        .detail-body { padding: 26px 30px 30px; }

        .detail-loading {
            color: var(--muted);
            padding: 12px 0;
        }

        .detail-synopsis {
            color: var(--ink-2);
            line-height: 1.6;
            margin-bottom: 22px;
            font-size: .95em;
        }

        .detail-section { margin-bottom: 20px; }
        .detail-section:last-child { margin-bottom: 0; }

        .detail-section h3 {
            font-family: var(--display);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: .82em;
            color: var(--accent);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--line-soft);
        }

        .detail-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 12px;
            padding: 4px 0;
            font-size: .9em;
            align-items: baseline;
        }

        .detail-label {
            color: var(--muted);
            font-weight: 600;
        }

        .detail-value { color: var(--ink-2); line-height: 1.5; }

        @media (max-width: 560px) {
            .detail-overlay { padding: 0; }
            .detail-dialog { border-radius: 0; min-height: 100vh; width: 100%; }
            .detail-banner { height: 210px; max-height: 30vh; padding: 16px; }
            .detail-title { font-size: 1.3em; }
            .detail-body { padding: 16px; }
            .detail-row { grid-template-columns: 92px 1fr; gap: 8px; font-size: .85em; }
        }

        /* Whole card opens the detail dialog. */
        .movie-card { cursor: pointer; }

        .movie-card:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 4px;
            border-radius: var(--radius-sm);
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 48px;
            font-size: 1.05em;
            grid-column: 1 / -1;
        }

        /* ===========================================================================================
           STATUS AND ERRORS
           =========================================================================================== */

        .status-banner {
            margin: 16px 0;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: .92em;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink-2);
        }

        .status-banner.error {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: var(--danger);
        }

        .status-banner.info {
            background: var(--surface);
            color: var(--ink-2);
        }

        .status-banner button {
            margin-left: auto;
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            border-radius: var(--radius-sm);
            padding: 4px 10px;
            cursor: pointer;
            font-size: .9em;
            font-family: var(--body);
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===========================================================================================
           ACCESSIBILITY  (carried forward from 6.1 — behaviour unchanged, colours re-themed)
           =========================================================================================== */

        .suggestion-item.active {
            background: var(--surface-2);
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        button:focus-visible,
        input:focus-visible,
        .suggestion-item:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ===========================================================================================
           RESPONSIVE
           =========================================================================================== */

        @media (max-width: 900px) {
            .container { padding: 24px 18px 48px; }
            h1 { font-size: 1.7em; }
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 18px 14px;
            }
        }

        @media (max-width: 560px) {
            .container { padding: 18px 14px 40px; }
            h1 { font-size: 1.4em; }
            .subtitle { font-size: .88em; margin-bottom: 20px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px 12px; }
            .get-recommendations { width: 100%; }
            .suggestions { max-height: 55vh; }
            input[type="text"] { font-size: 16px; }   /* below 16px iOS Safari zooms on focus */
            .movie-chip { width: 100%; justify-content: space-between; }
        }

        /* Portrait phones: a horizontal card.
         *
         * One full-width column with a 2:3 poster made each card ~650px tall, so thirty results meant
         * roughly 19,500px of scrolling. Turning the card sideways — small poster left, details right —
         * brings it to ~170px per card, about a third of the scrolling, and puts the title and match
         * explanation beside the artwork instead of below the fold. */
        @media (max-width: 560px) and (orientation: portrait) {
            .movie-grid { grid-template-columns: 1fr; gap: 12px; }

            .movie-card {
                display: grid;
                grid-template-columns: 96px 1fr;
                gap: 14px;
                background: var(--surface);
                border: 1px solid var(--line-soft);
                border-radius: var(--radius);
                padding: 10px;
                align-items: start;
            }

            .movie-poster { box-shadow: none; }
            .movie-card:hover .movie-poster { transform: none; box-shadow: none; }

            .movie-card-content { padding: 0; min-width: 0; }
            .movie-card h3 { font-size: 1em; }
            .movie-meta { font-size: .74em; }
            .movie-meta:nth-of-type(3) { -webkit-line-clamp: 2; font-size: .78em; margin: 6px 0; }
            .match-score { font-size: .9em; margin-top: 8px; padding-top: 8px; }
            .match-similar, .match-breakdown { font-size: .72em; }
        }

        html, body { max-width: 100%; overflow-x: hidden; }
        .movie-card h3, .movie-chip span { overflow-wrap: anywhere; }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2s; }
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Movie Recommender</h1>
        <p class="subtitle">Select 3-10 movies you love and get personalized recommendations</p>

        <!--
            ARIA combobox pattern. The search box was previously a bare <input> with a <div> of
            results, which is invisible to a screen reader: nothing announced that suggestions had
            appeared, how many there were, or which one was highlighted.

            role="combobox" + aria-expanded + aria-controls + aria-activedescendant is the standard
            pairing. aria-activedescendant is the important one — it lets focus stay in the input
            (so typing keeps working) while still telling assistive tech which option is current.
        -->
        <div class="search-section">
            <label for="searchInput" class="sr-only">Search for movies to add to your list</label>
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for movies..."
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="suggestions"
                    aria-autocomplete="list"
                    aria-describedby="searchHelp"
                    autocomplete="off">
                <p id="searchHelp" class="sr-only">
                    Type at least two characters. Use the up and down arrow keys to review results,
                    Enter to add a movie, and Escape to dismiss the list.
                </p>
                <div class="suggestions" id="suggestions" role="listbox"
                     aria-label="Movie search results"></div>
            </div>
        </div>

        <!--
            Status messages. aria-live="polite" means a screen reader announces changes here without
            interrupting whatever it is currently reading. Previously failures only reached
            console.error, so a blind user got no feedback at all — and neither did a sighted one.
        -->
        <div id="statusRegion" aria-live="polite" aria-atomic="true"></div>

        <div class="selected-movies">
            <h2>Your Selected Movies (<span id="count">0</span>/10)</h2>
            <div class="movie-chips" id="selectedMovies"></div>
            <p class="warning" id="warning"></p>
        </div>

        <button class="get-recommendations" id="getRecommendations" disabled>
            Get Recommendations
        </button>

        <div class="recommendations" id="recommendationsSection" style="display: none;">
            <h2>Recommended Movies For You</h2>
            <div class="movie-grid" id="movieGrid"></div>
        </div>
    </div>

    <!--
        Movie detail dialog. A sibling of .container, not a child, so it can cover the page.

        Replaces an expand-in-place synopsis that could never have worked: the card text is truncated
        to 100 characters before rendering, so un-clamping it revealed the same truncated string.

        Deliberately weighted toward information rather than artwork — the backdrop is a banner strip,
        not the content. Full synopsis, cast, crew, genres, and runtime are the point, plus the match
        explanation, which is the thing this app has that others do not.

        role="dialog" + aria-modal tells assistive technology the rest of the page is inert. Focus
        moves in on open and returns to the card that opened it on close.
    -->
    <div id="detailOverlay" class="detail-overlay" hidden>
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
            <button type="button" class="detail-close" id="detailClose" aria-label="Close details">&times;</button>
            <div class="detail-banner" id="detailBanner">
                <div class="detail-banner-text">
                    <h2 class="detail-title" id="detailTitle"></h2>
                    <p class="detail-meta" id="detailMeta"></p>
                </div>
            </div>
            <div class="detail-body" id="detailBody"></div>
        </div>
    </div>

    <script>
        /**
         * Movie Recommender — frontend.
         *
         * Flow: search TMDB -> select 3-10 movies -> fan out to TMDB similar/recommendations for each
         * pick -> score every candidate -> render the top 30 with a match breakdown.
         *
         * All TMDB access goes through our own /api proxy so the API key stays server-side.
         */

        /**
         * API base path.
         *
         * Always relative, and it works in all three environments for the same reason: the API is
         * always same-origin from the browser's point of view.
         *
         *   local dev  -> Express serves this page and the API together
         *   Render     -> same, in production
         *   Vercel     -> Vercel serves the page and *rewrites* /api/* through to Render (see
         *                 vercel.json), so the browser never sees a second domain
         *
         * That rewrite is why there is no host detection here and no CORS configuration to keep in
         * sync — including for preview deployments, whose domains change per branch.
         */
        const API_URL = '/api';

        /** Minimum picks required before recommendations can be requested. */
        const MIN_MOVIES = 3;
        /** Maximum picks allowed. */
        const MAX_MOVIES = 10;
        /**
         * Segments in the match meter.
         *
         * 20 gives 5% resolution — fine enough to separate cards that differ by a few points, coarse
         * enough that each segment stays visible at card width.
         */
        const SCORE_TICKS = 20;

        /** Debounce delay (ms) between keystrokes and firing a search. */
        const SEARCH_DEBOUNCE_MS = 500;

        /** @type {Array<object>} The user's selected movies, in pick order. */
        const selectedMovies = [];
        /** @type {Object<string, Array<object>>} Memoized search results, keyed by exact query. */
        const searchCache = {};
        /**
         * TMDB ids with an in-flight details request from selectMovie().
         *
         * Needed because selectMovie's duplicate and limit guards run *before* an await, so two fast
         * clicks on the same suggestion would both pass the checks and both push. See selectMovie().
         *
         * @type {Set<number>}
         */
        const pendingSelections = new Set();

        let searchTimeout;
        /**
         * Monotonic counter identifying the most recently *issued* search.
         *
         * The debounce alone does not prevent overlapping in-flight requests: typing "bat", pausing,
         * then typing "man" fires two searches, and if the older one resolves second it would render
         * results for "bat" while the input reads "batman". Each response compares its own token
         * against this value and discards itself if it is no longer the newest.
         */
        let latestSearchToken = 0;

        /** Index of the keyboard-highlighted suggestion; -1 when none is. */
        let activeSuggestion = -1;

        /** localStorage key for the user's picks. Versioned so a shape change can't break loading. */
        const STORAGE_KEY = 'movieRecommender.picks.v1';

        const searchInput = document.getElementById('searchInput');
        const suggestionsDiv = document.getElementById('suggestions');
        const selectedMoviesDiv = document.getElementById('selectedMovies');
        const countSpan = document.getElementById('count');
        const warningP = document.getElementById('warning');
        const getRecommendationsBtn = document.getElementById('getRecommendations');
        const statusRegion = document.getElementById('statusRegion');

        /**
         * Shows a status message, replacing any previous one.
         *
         * Failures previously only reached `console.error`, so nothing appeared on screen and nothing
         * was announced to a screen reader — the app just looked like it had done nothing. The
         * container is `aria-live="polite"`, so writing here announces the message without cutting off
         * whatever is currently being read.
         *
         * @param {string} message - Text to show. Set via textContent, never parsed as markup.
         * @param {object} [options]
         * @param {'info'|'error'} [options.type]
         * @param {boolean} [options.spinner] - Show a progress indicator.
         * @param {() => void} [options.onRetry] - Adds a Retry button wired to this callback.
         */
        function showStatus(message, { type = 'info', spinner = false, onRetry } = {}) {
            statusRegion.replaceChildren();

            const banner = document.createElement('div');
            banner.className = `status-banner ${type}`;

            if (spinner) {
                const dot = document.createElement('span');
                dot.className = 'spinner';
                // Decorative: the adjacent text already conveys the state.
                dot.setAttribute('aria-hidden', 'true');
                banner.appendChild(dot);
            }

            const text = document.createElement('span');
            text.textContent = message;
            banner.appendChild(text);

            if (onRetry) {
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.textContent = 'Retry';
                retry.addEventListener('click', onRetry);
                banner.appendChild(retry);
            }

            statusRegion.appendChild(banner);
        }

        /** Removes any status message. */
        function clearStatus() {
            statusRegion.replaceChildren();
        }

        /**
         * Opens or closes the suggestions list, keeping ARIA state in sync.
         *
         * Screen readers rely on `aria-expanded` to announce that results appeared. Toggling display
         * without it leaves them silent.
         *
         * @param {boolean} open
         */
        function setSuggestionsOpen(open) {
            suggestionsDiv.style.display = open ? 'block' : 'none';
            searchInput.setAttribute('aria-expanded', String(open));
            if (!open) {
                activeSuggestion = -1;
                searchInput.removeAttribute('aria-activedescendant');
            }
        }

        /**
         * Moves the keyboard highlight through the suggestions.
         *
         * Focus deliberately stays in the input so typing keeps working; `aria-activedescendant`
         * is what tells assistive technology which option is current. That is the whole point of the
         * combobox pattern — moving real focus into the list would break typing.
         *
         * @param {number} delta - +1 for down, -1 for up.
         */
        function moveActiveSuggestion(delta) {
            const items = [...suggestionsDiv.querySelectorAll('.suggestion-item')];
            if (items.length === 0) return;

            // Wraps at both ends, which is what the ARIA authoring practices describe.
            activeSuggestion = (activeSuggestion + delta + items.length) % items.length;

            items.forEach((item, i) => {
                const isActive = i === activeSuggestion;
                item.classList.toggle('active', isActive);
                item.setAttribute('aria-selected', String(isActive));
                if (isActive) {
                    searchInput.setAttribute('aria-activedescendant', item.id);
                    item.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(searchTimeout);
            activeSuggestion = -1;

            if (query.length < 2) {
                setSuggestionsOpen(false);
                return;
            }

            searchTimeout = setTimeout(() => searchMovies(query), SEARCH_DEBOUNCE_MS);
        });

        /**
         * Keyboard control for the suggestions list.
         *
         * The dropdown was previously mouse-only: a keyboard user could type a query and then had no
         * way to select a result.
         */
        searchInput.addEventListener('keydown', (e) => {
            const isOpen = suggestionsDiv.style.display === 'block';

            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                if (!isOpen) return;
                // Stop the caret jumping to the start or end of the input.
                e.preventDefault();
                moveActiveSuggestion(e.key === 'ArrowDown' ? 1 : -1);
                return;
            }

            if (e.key === 'Enter') {
                if (!isOpen || activeSuggestion < 0) return;
                e.preventDefault();
                suggestionsDiv.querySelectorAll('.suggestion-item')[activeSuggestion]?.click();
                return;
            }

            if (e.key === 'Escape') {
                if (!isOpen) return;
                e.preventDefault();
                setSuggestionsOpen(false);
            }
        });

        /**
         * Fetches JSON from our API, turning a non-2xx response into a thrown Error.
         *
         * The server now propagates real status codes: 400 for a malformed request, 404 for an
         * unknown movie, 503 when it has no TMDB key. Previously every failure arrived as HTTP 200
         * with a `{ success: false }` body, so `response.json()` succeeded and the caller silently
         * treated a broken call as an empty result. Checking `ok` is what makes those statuses useful.
         *
         * @param {string} url - Absolute or relative URL to request.
         * @returns {Promise<object>} Parsed JSON body.
         * @throws {Error} If the response status is not 2xx.
         */
        async function fetchJson(url) {
            const response = await fetch(url);

            if (!response.ok) {
                // The server sends `{ error: "..." }`; fall back to the status if the body is not JSON.
                let message = `Request failed (${response.status})`;
                try {
                    const body = await response.json();
                    if (body && typeof body.error === 'string') message = body.error;
                } catch {
                    // Non-JSON error body — keep the status-based message.
                }
                const error = new Error(message);
                error.status = response.status;
                throw error;
            }

            return response.json();
        }

        /**
         * Replaces the suggestions dropdown with a single plain-text status line.
         *
         * Uses textContent rather than innerHTML so that any message derived from an error or API
         * payload cannot inject markup.
         *
         * @param {string} message - Text to display.
         */
        function showSuggestionStatus(message) {
            suggestionsDiv.replaceChildren();
            const div = document.createElement('div');
            div.className = 'loading';
            div.textContent = message;
            suggestionsDiv.appendChild(div);
            setSuggestionsOpen(true);
        }

        /**
         * Searches TMDB and renders the results into the suggestions dropdown.
         *
         * Stale responses are discarded via `latestSearchToken`, so results always correspond to the
         * most recent query the user typed regardless of network ordering.
         *
         * @param {string} query - Search text (already trimmed, at least 2 characters).
         */
        async function searchMovies(query) {
            // Claim a token before doing anything async; any later call supersedes this one.
            const token = ++latestSearchToken;

            const cached = searchCache[query];
            if (cached) {
                displaySuggestions(cached);
                return;
            }

            showSuggestionStatus('Searching...');

            try {
                const data = await fetchJson(`${API_URL}/search?query=${encodeURIComponent(query)}`);

                // A newer search was issued while this one was in flight - drop this result.
                if (token !== latestSearchToken) return;

                if (data.results && data.results.length > 0) {
                    /*
                     * The require-atomic-updates warning on the next line is a false positive. The
                     * cache key is this call's own `query` and the value is its own response, so the
                     * write is idempotent: two concurrent searches for different queries touch
                     * different keys, and two for the same query write identical values. The real
                     * user-visible ordering hazard is handled by the `latestSearchToken` check above,
                     * which decides what actually gets rendered.
                     */
                    // eslint-disable-next-line require-atomic-updates
                    searchCache[query] = data.results;
                    displaySuggestions(data.results);
                } else {
                    showSuggestionStatus('No movies found');
                }
            } catch (error) {
                if (token !== latestSearchToken) return;
                // The server's message is specific and user-safe (e.g. "Query too long"), so prefer
                // it over a generic string.
                showSuggestionStatus(error.message || 'Error: could not reach the server');
                console.error('Search failed:', error);
            }
        }

        /**
         * Placeholder poster shown when TMDB has no artwork for a title.
         *
         * @param {number} width - Placeholder width in px.
         * @param {number} height - Placeholder height in px.
         * @param {string} label - Text drawn in the centre.
         * @returns {string} An inline SVG data URI.
         */
        function placeholderPoster(width, height, label) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
                `<rect width="${width}" height="${height}" fill="#ddd"/>` +
                `<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" ` +
                `fill="#999" font-size="${Math.round(height / 20)}">${label}</text></svg>`;
            return `data:image/svg+xml,${encodeURIComponent(svg)}`;
        }

        /**
         * Builds a poster <img> element.
         *
         * @param {string|null} posterPath - TMDB poster_path, or null/undefined if absent.
         * @param {string} size - TMDB image size segment, e.g. 'w92' or 'w500'.
         * @param {string} title - Movie title, used as alt text.
         * @param {string} className - CSS class for the element.
         * @param {number} w - Placeholder width.
         * @param {number} h - Placeholder height.
         * @returns {HTMLImageElement}
         */
        function buildPoster(posterPath, size, title, className, w, h) {
            const img = document.createElement('img');
            img.src = posterPath
                ? `https://image.tmdb.org/t/p/${size}${posterPath}`
                : placeholderPoster(w, h, 'No Image');
            // Assigning via the property (not an HTML attribute string) means a title containing
            // quotes or angle brackets cannot break out of the markup.
            img.alt = title || 'Movie poster';
            img.className = className;
            img.loading = 'lazy';
            return img;
        }

        /**
         * Renders search results into the suggestions dropdown.
         *
         * Elements are constructed with createElement/textContent rather than innerHTML. TMDB data is
         * third-party and community-edited, so titles and overviews are never interpolated into markup.
         *
         * @param {Array<object>} movies - TMDB search results.
         */
        function displaySuggestions(movies) {
            suggestionsDiv.replaceChildren();

            movies.slice(0, 10).forEach((movie, index) => {
                const year = movie.release_date ? movie.release_date.substring(0, 4) : 'N/A';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

                const item = document.createElement('div');
                item.className = 'suggestion-item';
                // aria-activedescendant references an element by id, so each option needs one.
                item.id = `suggestion-${index}`;
                item.setAttribute('role', 'option');
                item.setAttribute('aria-selected', 'false');

                const content = document.createElement('div');
                content.className = 'suggestion-content';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'suggestion-title';
                titleDiv.textContent = `${movie.title} (${year})`;

                const metaDiv = document.createElement('div');
                metaDiv.className = 'suggestion-meta';
                metaDiv.textContent = `Rating: ${rating}/10`;

                content.append(titleDiv, metaDiv);
                item.append(
                    buildPoster(movie.poster_path, 'w92', movie.title, 'suggestion-poster', 50, 75),
                    content
                );
                item.addEventListener('click', () => selectMovie(movie));
                suggestionsDiv.appendChild(item);
            });

            activeSuggestion = -1;
            setSuggestionsOpen(true);
        }

        /**
         * Adds a movie to the selection, fetching its full details (genres, director, cast) first.
         *
         * The duplicate and limit checks below run before an `await`, so without a guard two rapid
         * clicks on the same suggestion would both pass validation and both push, producing a
         * duplicate chip and allowing the MAX_MOVIES cap to be exceeded. `pendingSelections` closes
         * that window by claiming the id synchronously.
         *
         * @param {object} movie - A TMDB search result; only `id` and `title` are required here.
         */
        async function selectMovie(movie) {
            if (selectedMovies.length + pendingSelections.size >= MAX_MOVIES) {
                warningP.textContent = `Maximum ${MAX_MOVIES} movies allowed`;
                return;
            }

            if (selectedMovies.some(m => m.id === movie.id) || pendingSelections.has(movie.id)) {
                warningP.textContent = 'Movie already selected';
                return;
            }

            pendingSelections.add(movie.id);

            try {
                const fullMovie = await fetchJson(`${API_URL}/movie/${movie.id}`);

                selectedMovies.push({
                    id: fullMovie.id,
                    title: fullMovie.title,
                    year: fullMovie.release_date ? fullMovie.release_date.substring(0, 4) : 'N/A',
                    poster: fullMovie.poster_path,
                    rating: fullMovie.vote_average,
                    genres: fullMovie.genres || [],
                    director: fullMovie.credits?.crew?.find(c => c.job === 'Director')?.name || 'N/A',
                    // NOTE: only the top 3 actors are kept, but candidates are compared against their
                    // top 10, so actor overlap almost never fires. This asymmetry is deliberate for
                    // now and is addressed when the scoring model is rebuilt.
                    actors: fullMovie.credits?.cast?.slice(0, 3).map(a => a.name) || []
                });

                updateSelectedMovies();
                searchInput.value = '';
                setSuggestionsOpen(false);
                warningP.textContent = '';
            } catch (error) {
                console.error('Error fetching movie details:', error);
                showStatus(`Could not load "${movie.title}". ${error.message}`, {
                    type: 'error',
                    onRetry: () => { clearStatus(); selectMovie(movie); }
                });
            } finally {
                // Always release the claim, or a failed fetch would permanently block re-selection.
                pendingSelections.delete(movie.id);
            }
        }

        /**
         * Re-renders the selected-movie chips and syncs the counter, button state, and warning text.
         *
         * Remove buttons carry the movie's TMDB id in a data attribute and are wired through a single
         * delegated listener (see below) rather than an inline `onclick="removeMovie(i)"`. Keying on
         * id instead of array index removes the coupling between rendered markup and array position,
         * and avoids needing a global function reachable from an HTML attribute.
         */
        /**
         * Saves the current picks so a refresh does not wipe them.
         *
         * Only the trimmed fields the UI needs are stored — not the full TMDB payload, which is
         * ~34 KB per film and would blow past localStorage's ~5 MB budget with a handful of picks.
         *
         * Storage can throw (private browsing, quota exceeded, disabled entirely). Losing persistence
         * must never break the app, so failures are swallowed deliberately.
         */
        function savePicks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedMovies));
            } catch {
                // Non-fatal: the session still works, it just will not survive a refresh.
            }
        }

        /**
         * Restores picks saved by a previous session.
         *
         * Everything is validated rather than trusted: localStorage is user-writable and may hold
         * data from an older version of this code. Anything malformed is discarded rather than
         * allowed to render.
         *
         * @returns {number} How many picks were restored.
         */
        function loadPicks() {
            let stored;
            try {
                stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch {
                return 0;
            }

            if (!Array.isArray(stored)) return 0;

            const valid = stored.filter(m =>
                m && typeof m.id === 'number' && typeof m.title === 'string');

            selectedMovies.push(...valid.slice(0, MAX_MOVIES));
            return selectedMovies.length;
        }

        function updateSelectedMovies() {
            selectedMoviesDiv.replaceChildren();

            selectedMovies.forEach(movie => {
                const chip = document.createElement('div');
                chip.className = 'movie-chip';

                const content = document.createElement('div');
                content.className = 'movie-chip-content';

                if (movie.poster) {
                    content.appendChild(
                        buildPoster(movie.poster, 'w92', movie.title, 'movie-chip-poster', 50, 75)
                    );
                }

                const label = document.createElement('span');
                label.textContent = `${movie.title} (${movie.year})`;
                content.appendChild(label);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.type = 'button';
                removeBtn.textContent = '×';
                removeBtn.dataset.movieId = String(movie.id);
                removeBtn.setAttribute('aria-label', `Remove ${movie.title}`);

                chip.append(content, removeBtn);
                selectedMoviesDiv.appendChild(chip);
            });

            countSpan.textContent = selectedMovies.length;
            getRecommendationsBtn.disabled = selectedMovies.length < MIN_MOVIES;

            // Persist here rather than at each call site, so add, remove, and restore are all covered
            // by one place that cannot be forgotten.
            savePicks();

            if (selectedMovies.length < MIN_MOVIES) {
                const remaining = MIN_MOVIES - selectedMovies.length;
                warningP.textContent = `Please select at least ${remaining} more movie(s)`;
            } else {
                warningP.textContent = '';
            }
        }

        // Delegated handler for every chip's remove button, present and future.
        selectedMoviesDiv.addEventListener('click', (e) => {
            const btn = e.target.closest('.remove-btn');
            if (!btn) return;
            removeMovie(Number(btn.dataset.movieId));
        });

        /**
         * Removes a movie from the selection by TMDB id.
         *
         * @param {number} movieId - TMDB id of the movie to drop.
         */
        function removeMovie(movieId) {
            const index = selectedMovies.findIndex(m => m.id === movieId);
            if (index === -1) return;
            selectedMovies.splice(index, 1);
            updateSelectedMovies();
        }

        getRecommendationsBtn.addEventListener('click', getRecommendations);

        /**
         * Builds the recommendation list from the user's selections and renders it.
         *
         * For each selected movie this asks TMDB for both `similar` and `recommendations`, fetches
         * full details for every candidate, and scores it against that selection. Candidates surfaced
         * by more than one pick accumulate a match count.
         *
         * PERFORMANCE: candidate details are fetched serially inside a nested loop, so a 10-movie
         * selection issues up to ~200 sequential round-trips and can take 30-60 seconds. This is a
         * known architectural limitation, not an oversight - it is resolved by moving the pipeline
         * server-side behind a cache.
         *
         * KNOWN ISSUES (deliberately left for the scoring rebuild, so the same code is not fixed
         * twice): the `combined.slice(0, 20)` below discards the `recommendations` results because
         * `similar` already fills 20 slots; the score-max branch for multi-match candidates is
         * unreachable; equal scores tie-break by insertion order, favouring the first-picked movie;
         * and the catch below wraps the whole candidate loop, so a single failed request (a TMDB 429
         * is likely at this request volume) silently drops the rest of that movie's candidates.
         */
        async function getRecommendations() {
            if (selectedMovies.length < MIN_MOVIES) return;

            getRecommendationsBtn.disabled = true;
            getRecommendationsBtn.textContent = 'Finding similar movies...';

            // A cold request takes several seconds while the server fetches candidates from TMDB.
            // Without a visible indicator the page looks frozen, and a screen reader user gets no
            // signal at all that anything is happening.
            showStatus('Finding movies you might like...', { spinner: true });

            // try/finally guarantees the button is restored. Without it, anything thrown outside the
            // inner per-movie catch - a render error, a sort failure - would leave the button
            // permanently disabled reading "Finding similar movies...", recoverable only by reload.
            try {
                await buildAndRenderRecommendations();
                clearStatus();
            } catch (error) {
                console.error('Recommendation run failed:', error);
                showStatus(
                    error.message || 'Something went wrong building recommendations.',
                    { type: 'error', onRetry: () => getRecommendations() }
                );
            } finally {
                getRecommendationsBtn.disabled = false;
                getRecommendationsBtn.textContent = 'Get Recommendations';
            }
        }

        /**
         * Requests recommendations from the server and renders them.
         *
         * The entire pipeline -- candidate generation, detail fetching, scoring, and ranking -- now
         * runs server-side behind a cache. This previously looped in the browser, issuing up to ~200
         * sequential round-trips and taking 30-60 seconds; it is now one request.
         *
         * Moving it also fixed four bugs that lived in the removed code: candidates were only ever
         * scored against the first pick that surfaced them, TMDB's recommendations list was discarded
         * entirely, ties broke by pick order, and one failed request silently dropped ~20 candidates.
         */
        async function buildAndRenderRecommendations() {
            const response = await fetch(`${API_URL}/recommend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ movieIds: selectedMovies.map(m => m.id) })
            });

            if (!response.ok) {
                let message = `Request failed (${response.status})`;
                try {
                    const body = await response.json();
                    if (body && typeof body.error === 'string') message = body.error;
                } catch {
                    // Non-JSON error body - keep the status-based message.
                }
                throw new Error(message);
            }

            const { results, meta } = await response.json();
            console.log(`Recommendations: ${meta.returned} of ${meta.candidatePoolSize} candidates ` +
                `in ${meta.durationMs}ms`);

            // Partial results are reported rather than silently presented as complete.
            if (meta.failedCandidates > 0) {
                console.warn(`${meta.failedCandidates} candidate lookups failed; results may be incomplete.`);
            }

            displayRecommendations(results);
        }

        /**
         * Human-readable names for the feature types the server reports in `contributions`.
         *
         * These replace per-item emoji. An icon repeated once per value ("🔑 lgbt 🔑 gay theme
         * 🔑 homophobia") is pure noise — it costs a glyph per item and never says what the category
         * actually is. Stating the category once and listing its values under it is shorter and
         * clearer.
         *
         * The server names the *specific* features behind a match rather than category totals,
         * because cosine similarity decomposes exactly into per-feature contributions. Knowing it
         * matched on Christopher Nolan is far more useful than "Director +15".
         *
         * `dec` (decade) has no entry: the server no longer sends it, because the release year is
         * already on the card and "Era: 1990s" only restated it. `lang` survives but the server sends
         * it only when the film is not in English, where it is a genuine reason.
         */
        const FEATURE_GROUPS = {
            d: 'Director',
            w: 'Writer',
            c: 'Cast',
            k: 'Themes',
            g: 'Genre',
            lang: 'Language'
        };

        /**
         * Display order for those groups.
         *
         * Named people first: "same director" is the most concrete reason a recommendation can give.
         * Themes next, then the broader descriptors, which are usually weak signals anyway — a shared
         * genre carries little weight once rarity is accounted for.
         */
        const FEATURE_ORDER = ['d', 'w', 'c', 'k', 'g', 'lang'];

        /**
         * Creates a <div> with a class and plain text content.
         *
         * @param {string} className - CSS class to apply.
         * @param {string} text - Text content, assigned via textContent (never parsed as markup).
         * @returns {HTMLDivElement}
         */
        function textDiv(className, text) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            return div;
        }

        /**
         * Renders the recommendation grid.
         *
         * Every string that originates from TMDB - title, overview, the names in "Similar to" - is
         * assigned through textContent or a DOM property, never interpolated into an HTML string.
         *
         * @param {Array<object>} recs - Scored recommendations, already sorted and truncated.
         */
        function displayRecommendations(recs) {
            const movieGrid = document.getElementById('movieGrid');
            const recommendationsSection = document.getElementById('recommendationsSection');

            movieGrid.replaceChildren();

            if (recs.length === 0) {
                movieGrid.appendChild(textDiv('empty-state', 'No recommendations found'));
            } else {
                recs.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';

                    // The whole card opens the detail dialog. Keyboard-operable rather than
                    // click-only: role + tabindex + Enter and Space, matching a real <button>.
                    // aria-haspopup="dialog" tells assistive tech what activating it will do.
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-haspopup', 'dialog');
                    card.setAttribute('aria-label', `${movie.title} — view details`);

                    card.addEventListener('click', () => openDetails(movie, card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key !== 'Enter' && e.key !== ' ') return;
                        // Space would otherwise scroll the page.
                        e.preventDefault();
                        openDetails(movie, card);
                    });

                    const content = document.createElement('div');
                    content.className = 'movie-card-content';

                    const heading = document.createElement('h3');
                    heading.textContent = movie.title;

                    const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
                    // Full text, clamped to two lines by CSS rather than cut here. Truncating to 100
                    // characters is what made expand-in-place useless — unclamping revealed the same
                    // truncated string. The dialog shows the whole synopsis regardless.
                    const overview = movie.overview || '';

                    content.append(
                        heading,
                        textDiv('movie-meta', `Year: ${movie.year}`),
                        textDiv('movie-meta', `Rating: ⭐ ${rating}/10`),
                        textDiv('movie-meta', overview)
                    );

                    // --- Match score block ---------------------------------------------------------
                    const scoreBox = document.createElement('div');
                    scoreBox.className = 'match-score';

                    // Percentage and meter share a line. The meter makes two cards at 68% and 71%
                    // distinguishable at a glance, which the bare number does not; discrete ticks
                    // rather than a smooth bar because segments are easier to compare between cards.
                    const scoreLine = document.createElement('div');
                    scoreLine.className = 'score-line';

                    const pct = document.createElement('span');
                    pct.className = 'score-pct';
                    pct.textContent = `Match: ${movie.matchScore}%`;

                    const meter = document.createElement('span');
                    meter.className = 'score-meter';
                    // Decorative: the adjacent text already states the value, so announcing the ticks
                    // too would just be noise for a screen reader.
                    meter.setAttribute('aria-hidden', 'true');
                    const filled = Math.round((movie.matchScore / 100) * SCORE_TICKS);
                    for (let i = 0; i < SCORE_TICKS; i++) {
                        const tick = document.createElement('i');
                        if (i < filled) tick.className = 'on';
                        meter.appendChild(tick);
                    }

                    scoreLine.append(pct, meter);
                    scoreBox.appendChild(scoreLine);

                    // How many of the user's picks this film genuinely resembles. Meaningful again
                    // now that the server filters attribution by relative similarity — previously
                    // this saturated at the number of picks and read identically on every card.
                    const matched = (movie.similarTo || []).length;
                    if (matched > 1) {
                        const multi = document.createElement('div');
                        multi.className = 'match-multi';

                        const dots = document.createElement('span');
                        dots.className = 'match-dots';
                        dots.setAttribute('aria-hidden', 'true');
                        for (let i = 0; i < selectedMovies.length; i++) {
                            const dot = document.createElement('i');
                            if (i < matched) dot.className = 'on';
                            dots.appendChild(dot);
                        }

                        const text = document.createElement('span');
                        text.textContent = `matches ${matched} of your picks`;

                        multi.append(dots, text);
                        scoreBox.appendChild(multi);
                    }

                    // The old "🔥 Matches N of your movies!" badge is deliberately gone. Under the
                    // current model that count saturated at the number of picks -- nearly every film
                    // shares *something* with every pick (a language, a genre) -- so it rendered
                    // identically on all 30 cards and said nothing. The named contributions below
                    // carry the explanation instead.

                    const similarTo = movie.similarTo && movie.similarTo.length > 0
                        ? movie.similarTo.join(', ')
                        : 'N/A';
                    scoreBox.appendChild(textDiv('match-similar', `Because you liked: ${similarTo}`));

                    // Named features behind the match, grouped by type.
                    //
                    // Grouping also removes a real duplicate: a writer-director shows up as two
                    // separate contributions, so the flat list read "Frank Darabont, Frank Darabont".
                    // Under group headings that becomes "Director: Frank Darabont / Writer: Frank
                    // Darabont, Stephen King", which is the same information stated once each.
                    if (movie.contributions && movie.contributions.length > 0) {
                        const byType = new Map();
                        for (const c of movie.contributions) {
                            if (!byType.has(c.type)) byType.set(c.type, []);
                            byType.get(c.type).push(c.label);
                        }

                        const breakdown = document.createElement('div');
                        breakdown.className = 'match-breakdown';

                        for (const type of FEATURE_ORDER) {
                            const values = byType.get(type);
                            if (!values || values.length === 0) continue;

                            const row = document.createElement('div');
                            row.className = 'match-row';

                            const label = document.createElement('span');
                            label.className = 'match-label';
                            label.textContent = FEATURE_GROUPS[type] || type;

                            const value = document.createElement('span');
                            value.className = 'match-values';
                            // De-duplicated: the same name can legitimately appear twice within a type.
                            value.textContent = [...new Set(values)].join(', ');

                            row.append(label, value);
                            breakdown.appendChild(row);
                        }

                        if (breakdown.childElementCount > 0) scoreBox.appendChild(breakdown);
                    } else if (movie.breakdown) {
                        // Legacy shape, still emitted if the TF-IDF artifacts failed to load and the
                        // server fell back to the old scorer.
                        const legacyLabels = [
                            ['genre', '🎭 Genres'], ['director', '🎬 Director'],
                            ['actors', '👥 Actors'], ['year', '📅 Era'], ['rating', '⭐ Quality']
                        ];
                        const parts = legacyLabels
                            .filter(([key]) => movie.breakdown[key] > 0)
                            .map(([key, label]) => `${label} (+${movie.breakdown[key]})`);
                        if (parts.length > 0) {
                            scoreBox.appendChild(textDiv('match-breakdown', parts.join('  ')));
                        }
                    }

                    content.appendChild(scoreBox);
                    card.append(
                        buildPoster(movie.poster_path, 'w500', movie.title, 'movie-poster', 280, 400),
                        content
                    );
                    movieGrid.appendChild(card);
                });
            }

            recommendationsSection.style.display = 'block';
            recommendationsSection.scrollIntoView({ behavior: 'smooth' });
        }

        /* ===========================================================================================
           MOVIE DETAIL DIALOG
           =========================================================================================== */

        const detailOverlay = document.getElementById('detailOverlay');
        const detailBanner = document.getElementById('detailBanner');
        const detailTitle = document.getElementById('detailTitle');
        const detailMeta = document.getElementById('detailMeta');
        const detailBody = document.getElementById('detailBody');
        const detailClose = document.getElementById('detailClose');

        /** Element that opened the dialog, so focus can be handed back on close. */
        let detailOpener = null;

        /**
         * Incremented on every open. The in-flight fetch compares against it before rendering, so
         * closing the dialog — or opening a different film — discards a response that is no longer
         * wanted. Same problem the search box has, same fix.
         */
        let detailToken = 0;

        /**
         * Builds one labelled row in the details list.
         *
         * @param {string} label
         * @param {string} value
         * @returns {HTMLDivElement|null} Null when there is nothing to show, so callers can append
         *   unconditionally without producing empty rows.
         */
        function detailRow(label, value) {
            if (!value) return null;
            const row = document.createElement('div');
            row.className = 'detail-row';

            const l = document.createElement('span');
            l.className = 'detail-label';
            l.textContent = label;

            const v = document.createElement('span');
            v.className = 'detail-value';
            v.textContent = value;

            row.append(l, v);
            return row;
        }

        /**
         * Formats a runtime in minutes as hours and minutes.
         *
         * @param {number} minutes
         * @returns {string}
         */
        function formatRuntime(minutes) {
            if (!minutes) return '';
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        /**
         * Opens the detail dialog for a recommendation.
         *
         * Full credits are not in the recommendation payload — it carries only what the card renders —
         * so they are fetched on demand. The server caches TMDB responses, and every candidate was
         * already fetched while scoring, so this is normally a cache hit and returns immediately.
         *
         * @param {object} movie - A result object from POST /api/recommend.
         * @param {HTMLElement} opener - The card, so focus can return there on close.
         */
        async function openDetails(movie, opener) {
            detailOpener = opener;
            const token = ++detailToken;

            detailTitle.textContent = movie.title;
            detailMeta.textContent = '';
            detailBody.replaceChildren();
            detailBanner.style.backgroundImage = '';

            detailOverlay.hidden = false;
            // Stop the page behind scrolling while the dialog is open.
            document.body.style.overflow = 'hidden';
            detailClose.focus();

            const loading = document.createElement('div');
            loading.className = 'detail-loading';
            loading.textContent = 'Loading details...';
            detailBody.appendChild(loading);

            let details = null;
            try {
                details = await fetchJson(`${API_URL}/movie/${movie.id}`);
            } catch (error) {
                console.error('Could not load details:', error);
            }

            // Closed, or a different film opened, while the request was in flight.
            if (token !== detailToken || detailOverlay.hidden) return;

            detailBody.replaceChildren();

            if (details?.backdrop_path) {
                detailBanner.style.backgroundImage =
                    `url("https://image.tmdb.org/t/p/w1280${details.backdrop_path}")`;
            }

            const genres = (details?.genres || []).map(g => g.name).join(', ');
            const metaBits = [
                movie.year,
                formatRuntime(details?.runtime),
                genres,
                movie.vote_average ? `★ ${movie.vote_average.toFixed(1)}/10` : ''
            ].filter(Boolean);
            detailMeta.textContent = metaBits.join('  •  ');

            // --- Synopsis: the full text, which is what the card could not show ---------------------
            const synopsis = document.createElement('p');
            synopsis.className = 'detail-synopsis';
            synopsis.textContent = details?.overview || movie.overview || 'No synopsis available.';
            detailBody.appendChild(synopsis);

            // --- Why it was recommended --------------------------------------------------------------
            if (movie.similarTo?.length || movie.contributions?.length) {
                const why = document.createElement('section');
                why.className = 'detail-section';

                const h = document.createElement('h3');
                h.textContent = `Why this — ${movie.matchScore}% match`;
                why.appendChild(h);

                const rowSimilar = detailRow('Because you liked', (movie.similarTo || []).join(', '));
                if (rowSimilar) why.appendChild(rowSimilar);

                const byType = new Map();
                for (const c of movie.contributions || []) {
                    if (!byType.has(c.type)) byType.set(c.type, []);
                    byType.get(c.type).push(c.label);
                }
                for (const type of FEATURE_ORDER) {
                    const values = byType.get(type);
                    if (!values) continue;
                    const row = detailRow(FEATURE_GROUPS[type] || type, [...new Set(values)].join(', '));
                    if (row) why.appendChild(row);
                }

                detailBody.appendChild(why);
            }

            // --- Cast and crew, from the fetched credits ---------------------------------------------
            if (details?.credits) {
                const crew = details.credits.crew || [];
                const directors = [...new Set(crew.filter(c => c.job === 'Director').map(c => c.name))];
                const writers = [...new Set(crew
                    .filter(c => ['Writer', 'Screenplay', 'Story'].includes(c.job))
                    .map(c => c.name))];
                const cast = (details.credits.cast || []).slice(0, 6).map(c => c.name);

                const section = document.createElement('section');
                section.className = 'detail-section';

                const h = document.createElement('h3');
                h.textContent = 'Cast and crew';
                section.appendChild(h);

                for (const row of [
                    detailRow('Director', directors.join(', ')),
                    detailRow('Writers', writers.slice(0, 4).join(', ')),
                    detailRow('Cast', cast.join(', '))
                ]) {
                    if (row) section.appendChild(row);
                }

                if (section.childElementCount > 1) detailBody.appendChild(section);
            }
        }

        /** Closes the dialog and returns focus to whatever opened it. */
        function closeDetails() {
            detailOverlay.hidden = true;
            document.body.style.overflow = '';
            if (detailOpener) {
                detailOpener.focus();
                detailOpener = null;
            }
        }

        detailClose.addEventListener('click', closeDetails);

        // Clicking the dimmed area closes; clicking inside the dialog must not.
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) closeDetails();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !detailOverlay.hidden) closeDetails();
        });

        /**
         * Restores any saved picks and renders the initial state.
         *
         * Runs last so every function it depends on is defined. `updateSelectedMovies()` is called
         * unconditionally because it also sets the counter and the button's disabled state — skipping
         * it when nothing was restored would leave the UI showing stale defaults.
         */
        (function init() {
            const restored = loadPicks();
            updateSelectedMovies();

            if (restored > 0) {
                showStatus(
                    `Restored ${restored} movie${restored === 1 ? '' : 's'} from your last visit.`,
                    { type: 'info' }
                );
            }
        })();

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                setSuggestionsOpen(false);
            }
        });
    </script>
</body>
</html>
